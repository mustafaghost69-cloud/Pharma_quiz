<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Pharma Quiz</title>
<style>
body { font-family: Arial; background:#f6f6f6; padding:20px; }
.container { background:white; padding:20px; border-radius:10px; max-width:520px; margin:auto; }
#layout { display:flex; justify-content:space-between; }
#leftPanel { width:140px; text-align:center; }
#timer { font-size:22px; margin-bottom:10px; }
#score { font-size:18px; line-height:1.8; }
#questionBox { flex-grow:1; text-align:center; }
button { padding:10px 20px; margin:10px; font-size:18px; cursor:pointer; }
.correctBtn { background:#27ae60; color:white; }
.wrongBtn { background:#c0392b; color:white; }
#answerBox { margin-top:10px; font-size:20px; display:none; }
</style>
</head>
<body>

<div class="container">
<h2 style="text-align:center;">Pharma Quiz</h2>

<div id="layout">
  <div id="leftPanel">
    <div id="timer">00.00</div>
    <div id="score">
      صح: <span id="correctCount">0</span><br>
      خطأ: <span id="wrongCount">0</span><br>
      الوقت الكلي: <span id="totalTime">0.00</span>
    </div>
  </div>

  <div id="questionBox">
    <div id="question">اضغط ابدأ</div>

    <button id="startBtn" onclick="startQuiz()">ابدأ</button>
    <button id="doneBtn" style="display:none;" onclick="stopTimer()">تم</button>

    <div id="answerBox"></div>

    <div id="judge" style="display:none;">
      <button class="correctBtn" onclick="markCorrect()">صح</button>
      <button class="wrongBtn" onclick="markWrong()">خطأ</button>
    </div>
  </div>
</div>

</div>

<script>
let questions = [
"Cozar","Angizaar","Angizaar H","Losart","Losart H","LosarDenk",
"Hyzaar","Losazide","Losapres","L-sartan",
"Aprovel","Coaprovel","Aprovasc","Converium","Converuim plus",
"Vepram","Covepram","Gizlan","Gizlan plus","Gizlan duo",
"Rabital","Rabital H","Vivazac"
];

questions = questions.sort(() => Math.random() - 0.5);

let index = -1;
let timer;
let seconds = 0;
let totalSeconds = 0;
let correctCount = 0;
let wrongCount = 0;

function startQuiz(){
 document.getElementById("startBtn").style.display="none";
 nextQuestion();
}

function nextQuestion(){
 index++;
 if(index >= questions.length){
   document.getElementById("question").innerHTML = "انتهى الاختبار";
   document.getElementById("doneBtn").style.display="none";
   document.getElementById("judge").style.display="none";
   document.getElementById("answerBox").style.display="none";
   clearInterval(timer);
   return;
 }

 document.getElementById("question").innerHTML = questions[index];
 document.getElementById("doneBtn").style.display="inline-block";
 document.getElementById("judge").style.display="none";
 document.getElementById("answerBox").style.display="none";

 resetTimer();
}

function resetTimer(){
 clearInterval(timer);
 seconds = 0;
 document.getElementById("timer").innerHTML = "00.00";

 timer = setInterval(()=>{
   seconds += 0.01;
   document.getElementById("timer").innerHTML = seconds.toFixed(2);
 },10);
}

function stopTimer(){
 clearInterval(timer);
 totalSeconds += seconds;
 document.getElementById("totalTime").innerHTML = totalSeconds.toFixed(2);

 document.getElementById("doneBtn").style.display="none";

 document.getElementById("answerBox").innerHTML =
   "الجواب الصحيح: " + questions[index];
 document.getElementById("answerBox").style.display="block";

 document.getElementById("judge").style.display="block";
}

function markCorrect(){
 correctCount++;
 document.getElementById("correctCount").innerHTML = correctCount;
 document.getElementById("judge").style.display="none";
 nextQuestion();
}

function markWrong(){
 wrongCount++;
 document.getElementById("wrongCount").innerHTML = wrongCount;
 document.getElementById("judge").style.display="none";
 nextQuestion();
}
</script>

</body>
</html>
