
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Pharma Quiz</title>
<style>
body { font-family: Arial; background:#f6f6f6; padding:20px; }
.container { background:white; padding:20px; border-radius:10px; max-width:400px; margin:auto; text-align:center; }
button { padding:10px 20px; margin:10px; font-size:18px; }
#timer { font-size:22px; margin-bottom:15px; }
</style>
</head>
<body>

<div class="container">
<h2>Pharma Quiz</h2>
<div id="timer">الوقت: 10</div>
<div id="question">اضغط ابدأ لبدء الاختبار</div>

<button id="startBtn" onclick="startQuiz()">ابدأ</button>
<button id="nextBtn" style="display:none;" onclick="nextQuestion()">تم</button>

<div id="judge" style="display:none;">
<button onclick="correct()">صح</button>
<button onclick="wrong()">خطأ</button>
</div>

</div>

<script>
let questions = [
"Cozar","Angizaar","Angizaar H","Losart","Losart H","LosarDenk",
"Hyzaar","Losazide","Losapres","L-sartan",
"Aprovel","Coaprovel","Aprovasc","Converium","Converuim plus",
"Vepram","Covepram","Gizlan","Gizlan plus","Gizlan duo",
"Rabital","Rabital H","Vivazac"
];

let current = -1;
let timeLeft = 10;
let timer;

function startQuiz(){
 document.getElementById("startBtn").style.display="none";
 nextQuestion();
}

function nextQuestion(){
 current++;
 if(current >= questions.length){
   document.getElementById("question").innerHTML = "انتهى الاختبار";
   document.getElementById("nextBtn").style.display="none";
   document.getElementById("judge").style.display="none";
   clearInterval(timer);
   return;
 }
 document.getElementById("question").innerHTML = questions[current];
 document.getElementById("nextBtn").style.display="inline-block";
 document.getElementById("judge").style.display="none";
 resetTimer();
}

function resetTimer(){
 timeLeft = 10;
 document.getElementById("timer").innerHTML = "الوقت: " + timeLeft;
 clearInterval(timer);
 timer = setInterval(()=>{
   timeLeft--;
   document.getElementById("timer").innerHTML = "الوقت: " + timeLeft;
   if(timeLeft <= 0){
     clearInterval(timer);
     document.getElementById("judge").style.display="block";
     document.getElementById("nextBtn").style.display="none";
   }
 },1000);
}

function correct(){
 nextQuestion();
}

function wrong(){
 nextQuestion();
}
</script>

</body>
</html>
